# Copy this file to secrets.yaml (NOT committed to git — see .gitignore)
# and fill in your real email details. No Twilio, no SMS, no sandbox.
#
# HOW TO GET A GMAIL APP PASSWORD (takes ~2 minutes):
#   1. Turn on 2-Step Verification on your Google account, if it isn't
#      already on: myaccount.google.com/security
#   2. Go to myaccount.google.com/apppasswords
#   3. Create a new app password (name it anything, e.g. "kitting robot")
#   4. Google shows you a 16-letter code like "abcd efgh ijkl mnop" —
#      that's sender_app_password below. It is NOT your normal Gmail
#      password, and you can only see it once, so copy it now.
#
# sender_email and receiver_email can be the same address — you can email
# yourself.

email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 465
  sender_email: "youraddress@gmail.com"
  sender_app_password: "abcdefghijklmnop"
  receiver_email: "youraddress@gmail.com"

# Using a non-Gmail address instead? Change smtp_server/smtp_port to your
# provider's SMTP settings (e.g. Outlook: smtp.office365.com, port 587 —
# in which case also change EmailNotifier in notify_logic.py from
# SMTP_SSL to SMTP + starttls(); ask if you hit this).

# Only needed if config/checklists.yaml's roboflow.model_id is set (i.e.
# you're using a hosted Roboflow model instead of/alongside a local one —
# see kitting_logic/vision_logic.py). Get a free key at
# app.roboflow.com/settings/api (Private API Key, under your workspace).
roboflow:
  api_key: ""
